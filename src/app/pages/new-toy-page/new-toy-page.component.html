<div class="container slide-up-in">
	<dav-header size="lg">{{ locale.title }}</dav-header>

	@if (!dataService.dav.isLoggedIn) {
	<p class="info">{{ locale.loginRequired }}</p>

	<dav-button tonal (click)="navigateToUserPage()">
		{{ userLocale.login }}
	</dav-button>
	} @else {
	<div class="form">
		<dav-textfield
			[label]="locale.titleLabel"
			[value]="title"
			[errorMessage]="titleError"
			(change)="titleChange($event)"
		></dav-textfield>

		<dav-textarea
			[label]="locale.descriptionLabel"
			[value]="description"
			(change)="descriptionChange($event)"
		></dav-textarea>

		<dav-textfield
			[label]="locale.priceLabel"
			[value]="price"
			[errorMessage]="priceError"
			(change)="priceChange($event)"
			(enter)="submit()"
		></dav-textfield>

		@if (error) {
		<p class="error">{{ error }}</p>
		}

		<div>
			<dav-button [disabled]="loading" (click)="submit()">
				{{ locale.submit }}
			</dav-button>
		</div>
	</div>
	}
</div>
