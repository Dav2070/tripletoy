<div class="container slide-up-in">
	<dav-header size="lg">{{ locale.headline }}</dav-header>
	<p class="subhead">{{ locale.subhead }}</p>

	@if (toys.length > 0) {
	<div class="toys-grid">
		@for (toy of toys; track toy.uuid) {
		<app-toy-card [toy]="toy"></app-toy-card>
		}
	</div>

	@if (toys.length < total) {
	<div class="load-more-container">
		<dav-button tonal [disabled]="loading" (click)="loadToys()">
			{{ locale.loadMore }}
		</dav-button>
	</div>
	} } @else if (!loading) {
	<div class="empty-container">
		<p>{{ locale.noToys }}</p>

		<dav-button (click)="navigateToNewToyPage()">
			{{ locale.sellFirst }}
		</dav-button>
	</div>
	}
</div>
