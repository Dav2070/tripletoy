<div class="navbar">
	<!-- Logo + name -->
	<a class="navbar-header" routerLink="/">
		<span class="logo-badge"><fa-icon [icon]="faPuzzlePiece"></fa-icon></span>
		<span class="logo-name" [attr.aria-label]="locale.appName">
			@for (letter of appNameLetters; track $index) {
			<span class="logo-letter" aria-hidden="true">{{ letter }}</span>
			}
		</span>
	</a>

	<div class="navbar-tab-bar-container">
		<dav-tab-bar>
			<dav-tab-bar-item
				[active]="startTabActive"
				(click)="navigateToStartPage()"
			>
				{{ locale.home }}
			</dav-tab-bar-item>

			<dav-tab-bar-item
				[active]="toysTabActive"
				(click)="navigateToToysPage()"
			>
				{{ locale.toys }}
			</dav-tab-bar-item>
		</dav-tab-bar>
	</div>

	<div class="navbar-spacer"></div>

	<div class="navbar-icon-buttons-container">
		<dav-icon-button
			[selected]="userButtonSelected"
			(click)="navigateToUserPage()"
		>
			@if (dataService.dav.isLoggedIn) {
				<img
					[src]="dataService.profileImageUrl"
					class="profile-image"
					height="28"
					width="28"
					alt=""
				/>
			} @else if (userButtonSelected) {
				<fa-icon [icon]="faCircleUserSolid"></fa-icon>
			} @else {
				<fa-icon [icon]="faCircleUserRegular"></fa-icon>
			}
		</dav-icon-button>
	</div>
</div>

<div class="content-container">
	<router-outlet></router-outlet>
</div>
