<div class="navbar acrylic">
	<!-- Logo + name -->
	<a class="navbar-header" routerLink="/">
		<fa-icon [icon]="faPuzzlePiece"></fa-icon>
		<span>{{ locale.appName }}</span>
	</a>

	<div class="navbar-spacer"></div>

	<div class="navbar-icon-buttons-container">
		@if (!dataService.isMobile) {
		<dav-button (click)="navigateToNewToyPage()">
			{{ locale.sell }}
		</dav-button>
		} @else {
		<dav-icon-button (click)="navigateToNewToyPage()">
			<fa-icon [icon]="faPlus"></fa-icon>
		</dav-icon-button>
		}

		<dav-icon-button
			[selected]="userButtonSelected"
			(click)="navigateToUserPage()"
		>
			@if (dataService.dav.isLoggedIn) {
			<img
				[src]="dataService.profileImageUrl"
				class="profile-image"
				height="28"
				width="28"
				alt=""
			/>
			} @else if (userButtonSelected) {
			<fa-icon [icon]="faCircleUserSolid"></fa-icon>
			} @else {
			<fa-icon [icon]="faCircleUserRegular"></fa-icon>
			}
		</dav-icon-button>
	</div>
</div>

<div class="content-container">
	<router-outlet></router-outlet>
</div>
